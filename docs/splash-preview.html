<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh;
    background: #0a0a0b;
    color: #e4e4e7;
    overflow: hidden;
  }
  .title {
    font-weight: 700; font-size: 18px; letter-spacing: 2px;
    margin-bottom: 20px;
  }
  .title-char {
    display: inline-block;
    opacity: 0;
    transform: translateY(10px) scale(0.85);
    animation: charReveal 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes charReveal {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .dots {
    display: flex; gap: 6px;
    margin-bottom: 10px;
  }
  .dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: #27272a;
    opacity: 0;
    animation: dotIn 0.2s ease forwards;
    transition: background 0.25s, transform 0.25s, box-shadow 0.25s;
  }
  .dot.filled {
    background: #3b82f6;
    transform: scale(1.3);
    box-shadow: 0 0 6px rgba(59,130,246,0.4);
  }
  .dot.complete {
    background: #22c55e;
    transform: scale(1);
    box-shadow: 0 0 3px rgba(34,197,94,0.25);
  }
  @keyframes dotIn {
    from { opacity: 0; transform: scale(0); }
    to { opacity: 1; transform: scale(1); }
  }
  .step-label {
    font-size: 12px; color: #52525b;
    text-align: center;
    min-height: 16px;
  }
  .step-label.active { color: #a1a1aa; }
  .credit {
    margin-top: 24px; font-size: 9px; color: #27272a; letter-spacing: 0.5px;
    opacity: 0;
    animation: fadeIn 0.3s 1.2s ease forwards;
  }
  @keyframes fadeIn {
    to { opacity: 0.4; }
  }
  .controls {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; z-index: 10;
  }
  .controls button {
    background: #27272a; color: #71717a; border: 1px solid #3f3f46;
    padding: 3px 8px; font-size: 10px; cursor: pointer; border-radius: 3px;
  }
  .controls button:hover { background: #3f3f46; color: #e4e4e7; }
</style>
</head>
<body>
  <div class="title" id="title"></div>
  <div class="dots">
    <div class="dot" style="animation-delay:0.6s"></div>
    <div class="dot" style="animation-delay:0.65s"></div>
    <div class="dot" style="animation-delay:0.7s"></div>
    <div class="dot" style="animation-delay:0.75s"></div>
    <div class="dot" style="animation-delay:0.8s"></div>
  </div>
  <div class="step-label" id="stepLabel"></div>
  <div class="credit">Designed by UICO</div>
  <div class="controls">
    <button onclick="replay()">重播</button>
    <button onclick="activateStep(-1)">空闲</button>
    <button onclick="simulate()">模拟</button>
  </div>
  <script>
    var steps = ['初始化工作区', '加载卡片数据', '加载画板快照', '恢复回收站', '准备就绪'];
    var titleText = 'AlphaBase';
    var titleEl = document.getElementById('title');
    for (var i = 0; i < titleText.length; i++) {
      var span = document.createElement('span');
      span.className = 'title-char';
      span.textContent = titleText[i];
      span.style.animationDelay = (i * 0.05) + 's';
      titleEl.appendChild(span);
    }
    function activateStep(n) {
      var label = document.getElementById('stepLabel');
      label.classList.remove('active');
      var dots = document.querySelectorAll('.dot');
      for (var i = 0; i < dots.length; i++) {
        dots[i].classList.remove('filled', 'complete');
        if (i < n) dots[i].classList.add('complete');
        else if (i === n) dots[i].classList.add('filled');
      }
      if (n >= 0 && n < steps.length) {
        label.textContent = steps[n];
        label.classList.add('active');
      } else {
        label.textContent = '';
      }
    }
    function replay() {
      var chars = document.querySelectorAll('.title-char');
      chars.forEach(function(c, i) {
        c.style.animation = 'none';
        c.offsetHeight;
        c.style.animation = 'charReveal 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards';
        c.style.animationDelay = (i * 0.05) + 's';
      });
      activateStep(-1);
    }
    function simulate() {
      replay();
      for (var i = 0; i < steps.length; i++) {
        (function(step) {
          setTimeout(function() { activateStep(step); }, 800 + step * 500);
        })(i);
      }
    }
  </script>
</body>
</html>
