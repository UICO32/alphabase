<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: hepta-media: http: https:; connect-src 'self' http: https: ws: wss:; frame-src http: https:; worker-src 'self' blob:" />
    <title>AlphaBase</title>
    <!-- DIN family: DIN Alternate (macOS), DIN 1451 (some installs), Oswald fallback -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" />
    <script src="/theme-startup.js"></script>
    <style>
      #splash { margin: 0; padding: 0; box-sizing: border-box; }
      #splash *, #splash *::before, #splash *::after { box-sizing: border-box; }

      #splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        background: var(--sp-bg); overflow: hidden;
        transition: opacity 0.3s ease;
      }
      #splash.fade-out { opacity: 0; pointer-events: none; }

      /* --- Title bar --- */
      .sp-titlebar {
        height: 32px; background: var(--sp-panel);
        display: flex; align-items: center; padding: 0 12px; gap: 8px;
        border-bottom: 1px solid var(--sp-border);
      }
      .sp-dot { width: 12px; height: 12px; border-radius: 50%; }
      .sp-titlebar-bar {
        width: 120px; height: 10px; border-radius: 4px; margin-left: 8px;
        background: linear-gradient(90deg, var(--sp-bar-from) 25%, var(--sp-bar-mid) 50%, var(--sp-bar-from) 75%);
        background-size: 200% 100%; animation: shimmer 1.8s ease-in-out infinite;
      }

      /* --- Main layout --- */
      .sp-main { display: flex; flex: 1; min-height: 0; }

      /* --- Panels --- */
      .sp-left {
        width: 260px; min-width: 260px; background: var(--sp-panel);
        display: flex; flex-direction: column; overflow: hidden;
        border-right: 1px solid var(--sp-border);
        transform: translateX(-101%); opacity: 0;
      }
      .sp-left.entered { animation: slideInLeft 0.6s cubic-bezier(0.22,1,0.36,1) forwards; }
      .sp-right {
        width: 360px; min-width: 360px; background: var(--sp-panel);
        display: flex; flex-direction: column; overflow: hidden;
        border-left: 1px solid var(--sp-border);
        transform: translateX(101%); opacity: 0;
      }
      .sp-right.entered { animation: slideInRight 0.6s cubic-bezier(0.22,1,0.36,1) forwards; }
      @keyframes slideInLeft {
        from { transform: translateX(-101%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes slideInRight {
        from { transform: translateX(101%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      .sp-canvas {
        flex: 1; background: var(--sp-bg); position: relative;
        background-image: radial-gradient(circle, var(--sp-border) 1px, transparent 1px);
        background-size: 24px 24px;
      }

      /* --- Shimmer bar --- */
      .sp-bar {
        background: linear-gradient(90deg, var(--sp-bar-from) 25%, var(--sp-bar-mid) 50%, var(--sp-bar-from) 75%);
        background-size: 200% 100%; animation: shimmer 1.8s ease-in-out infinite;
        border-radius: 3px;
      }
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }

	      /* --- Logo with shimmer sweep --- */
      .sp-logo {
        font-weight: 700; font-size: 28px; letter-spacing: 3px;
        color: transparent; user-select: none;
        background: linear-gradient(
          110deg,
          var(--sp-text) 0%, var(--sp-text) 35%,
          #f97316 42%, #eab308 48%,
          #3b82f6 54%, #0ea5e9 60%,
          var(--sp-text) 66%, var(--sp-text) 100%
        );
        background-size: 250% 100%;
        background-clip: text; -webkit-background-clip: text;
        animation: logoShimmer 4.0s ease-in-out infinite;
        animation-delay: 0.35s;
      }
      @keyframes logoShimmer {
        0% { background-position: 250% 0; }
        100% { background-position: -250% 0; }
      }

      .sp-credit {
        margin-top: 8px; font-size: 10px; color: var(--sp-muted);
        letter-spacing: 0.5px; opacity: 0.7;
      }
      .sp-progress-track {
        width: 140px; height: 3px; background: var(--sp-border);
        border-radius: 2px; overflow: hidden; margin-top: 16px;
      }
      .sp-progress-fill {
        height: 100%; width: 0%; background: var(--sp-fill);
        border-radius: 2px; transition: width 0.3s ease;
      }
      .sp-step {
        font-size: 11px; color: var(--sp-muted);
        text-align: center; min-height: 16px; margin-top: 8px;
        animation: stepBreathe 2s ease-in-out infinite alternate;
      }
      @keyframes stepBreathe { 0% { opacity: 0.5; } 100% { opacity: 1; } }

      /* --- Left panel internals --- */
      .sp-lp-header {
        display: flex; align-items: center; gap: 8px; padding: 12px 16px;
        border-bottom: 1px solid var(--sp-border);
        animation: fadeIn 0.3s ease both; animation-delay: 0.35s;
      }
      .sp-lp-icon { width: 16px; height: 16px; border-radius: 3px; }
      .sp-lp-header-text { flex: 1; height: 12px; }
      .sp-lp-tabs {
        display: flex; gap: 8px; padding: 8px;
        animation: fadeIn 0.3s ease both; animation-delay: 0.4s;
      }
      .sp-lp-tab { height: 32px; border-radius: 6px; flex: 1; }
      .sp-lp-sep { height: 1px; background: var(--sp-border); margin: 4px 8px; }
      .sp-lp-list {
        flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 8px;
        animation: fadeIn 0.3s ease both; animation-delay: 0.45s;
      }
      .sp-lp-item { height: 36px; border-radius: 6px; margin: 0 4px; }
      .sp-lp-trash {
        border-top: 1px solid var(--sp-border); padding: 12px 8px;
        animation: fadeIn 0.3s ease both; animation-delay: 0.5s;
      }
      .sp-lp-trash-bar { height: 36px; width: 100%; border-radius: 6px; }

      /* --- Right panel internals --- */
      .sp-rp-tabs {
        display: flex; align-items: center; gap: 8px; padding: 12px 16px;
        border-bottom: 1px solid var(--sp-border);
        animation: fadeIn 0.3s ease both; animation-delay: 0.35s;
      }
      .sp-rp-tab { height: 40px; border-radius: 6px; flex: 1; }
      .sp-rp-collapse { width: 16px; height: 16px; border-radius: 3px; margin-left: 8px; }
      .sp-rp-content {
        padding: 24px; display: flex; flex-direction: column; gap: 16px;
        animation: fadeIn 0.3s ease both; animation-delay: 0.45s;
      }
      .sp-rp-title { height: 14px; width: 80%; }
      .sp-rp-meta { height: 10px; width: 60%; }
      .sp-rp-editor { height: 200px; width: 100%; border-radius: 8px; }
      .sp-rp-ai-label { height: 10px; width: 50px; }
      .sp-rp-ai-line { height: 10px; width: 100%; }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      /* --- Center overlay in canvas --- */
      .sp-center {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 1;
      }
    </style>
  </head>
  <body spellcheck="false">
    <div id="splash">
      <!-- Title bar -->
      <div class="sp-titlebar">
        <div class="sp-dot" style="background:#ff5f57"></div>
        <div class="sp-dot" style="background:#ffbd2e"></div>
        <div class="sp-dot" style="background:#28c840"></div>
        <div class="sp-titlebar-bar"></div>
      </div>

      <div class="sp-main">
        <!-- Left panel -->
        <div class="sp-left">
          <div class="sp-lp-header">
            <div class="sp-lp-icon sp-bar"></div>
            <div class="sp-lp-header-text sp-bar"></div>
            <div class="sp-lp-icon sp-bar"></div>
          </div>
          <div class="sp-lp-tabs">
            <div class="sp-lp-tab sp-bar"></div>
            <div class="sp-lp-tab sp-bar"></div>
          </div>
          <div class="sp-lp-sep"></div>
          <div class="sp-lp-list">
            <div class="sp-lp-item sp-bar"></div>
            <div class="sp-lp-item sp-bar"></div>
            <div class="sp-lp-item sp-bar"></div>
            <div class="sp-lp-item sp-bar"></div>
          </div>
          <div class="sp-lp-trash">
            <div class="sp-lp-trash-bar sp-bar"></div>
          </div>
        </div>

        <!-- Canvas -->
        <div class="sp-canvas">
          <div class="sp-center">
            <div class="sp-logo">AlphaBase</div>
            <div class="sp-credit">Designed by UICO Lab</div>
            <div class="sp-progress-track"><div class="sp-progress-fill" id="splash-fill"></div></div>
            <div class="sp-step" id="splash-step"></div>
          </div>
        </div>

        <!-- Right panel -->
        <div class="sp-right">
          <div class="sp-rp-tabs">
            <div class="sp-rp-tab sp-bar"></div>
            <div class="sp-rp-tab sp-bar"></div>
            <div class="sp-rp-collapse sp-bar"></div>
          </div>
          <div class="sp-rp-content">
            <div class="sp-rp-title sp-bar"></div>
            <div class="sp-rp-meta sp-bar"></div>
            <div class="sp-rp-editor sp-bar"></div>
            <div class="sp-rp-ai-label sp-bar"></div>
            <div class="sp-rp-ai-line sp-bar" style="width:90%"></div>
            <div class="sp-rp-ai-line sp-bar" style="width:70%"></div>
            <div class="sp-rp-ai-line sp-bar" style="width:50%"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script src="/splash-startup.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
