<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlphaBase</title>
    <style>
      /* Splash screen — reads theme from localStorage to match app theme */
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        transition: opacity 0.3s ease;
        overflow: hidden;
      }
      #splash.fade-out { opacity: 0; pointer-events: none; }

      /* Light theme (default) */
      :root #splash {
        background: linear-gradient(160deg, hsl(220, 20%, 97%) 0%, hsl(0, 0%, 96%) 100%);
        color: hsl(0, 0%, 12%);
      }
      :root #splash .dot-grid {
        background-image: radial-gradient(circle, hsla(220, 20%, 60%, 0.12) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      :root #splash .spinner {
        border: 3px solid hsla(220, 15%, 85%, 0.6);
        border-top-color: #3b82f6;
      }
      :root #splash .progress-track {
        background: hsla(220, 15%, 85%, 0.5);
      }
      :root #splash .progress-bar {
        background: linear-gradient(90deg, #3b82f6, #60a5fa);
      }
      :root #splash .step-label {
        color: hsl(0, 0%, 42%);
      }
      :root #splash .credit {
        color: hsl(0, 0%, 58%);
      }
      :root #splash .glow-orb {
        background: radial-gradient(circle, hsla(220, 90%, 65%, 0.08) 0%, transparent 70%);
      }

      /* Dark theme */
      [data-theme="dark"] #splash {
        background: linear-gradient(160deg, hsl(220, 25%, 8%) 0%, hsl(220, 20%, 6%) 100%);
        color: hsl(220, 15%, 92%);
      }
      [data-theme="dark"] #splash .dot-grid {
        background-image: radial-gradient(circle, hsla(220, 20%, 50%, 0.1) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      [data-theme="dark"] #splash .spinner {
        border: 3px solid hsla(220, 18%, 22%, 0.6);
        border-top-color: #60a5fa;
      }
      [data-theme="dark"] #splash .progress-track {
        background: hsla(220, 18%, 22%, 0.5);
      }
      [data-theme="dark"] #splash .progress-bar {
        background: linear-gradient(90deg, #3b82f6, #60a5fa);
      }
      [data-theme="dark"] #splash .step-label {
        color: hsl(220, 12%, 68%);
      }
      [data-theme="dark"] #splash .credit {
        color: hsl(220, 10%, 52%);
      }
      [data-theme="dark"] #splash .glow-orb {
        background: radial-gradient(circle, hsla(220, 90%, 55%, 0.06) 0%, transparent 70%);
      }

      /* Dot grid texture overlay */
      .dot-grid {
        position: absolute; inset: 0;
        pointer-events: none;
        opacity: 0.8;
      }

      /* Ambient glow orbs */
      .glow-orb {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        animation: float-orb 8s ease-in-out infinite;
      }
      .glow-orb-1 {
        width: 400px; height: 400px;
        top: -10%; right: -5%;
        animation-delay: 0s;
      }
      .glow-orb-2 {
        width: 300px; height: 300px;
        bottom: -8%; left: -3%;
        animation-delay: -4s;
      }

      @keyframes float-orb {
        0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.6; }
        33% { transform: translate(20px, -15px) scale(1.05); opacity: 0.8; }
        66% { transform: translate(-10px, 10px) scale(0.95); opacity: 0.5; }
      }

      .splash-content {
        position: relative;
        z-index: 1;
        display: flex; flex-direction: column; align-items: center;
      }

      #splash .spinner-row {
        display: flex; align-items: center; margin-bottom: 24px;
        animation: breathe 3s ease-in-out infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.02); }
      }
      #splash .spinner {
        width: 32px; height: 32px;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 14px;
      }
      #splash .progress-track {
        width: 200px; height: 3px;
        border-radius: 2px;
        overflow: hidden;
      }
      #splash .progress-bar {
        width: 0%; height: 100%;
        border-radius: 2px;
        transition: width 0.3s ease;
        box-shadow: 0 0 8px rgba(59, 130, 246, 0.3);
      }
      #splash .step-label {
        margin-top: 10px;
        font-size: 12px;
        min-height: 16px;
      }
      #splash .credit {
        margin-top: 32px;
        font-size: 11px;
      }
    </style>
    <script>
      // Apply theme immediately to avoid flash of wrong theme
      (function() {
        var stored = localStorage.getItem('hepta-theme');
        var mode = stored === 'dark' || stored === 'light' ? stored : 'system';
        var resolved = mode;
        if (mode === 'system') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', resolved);
      })();
    </script>
    
    
    
    
    
                      </head>
  <body spellcheck="false">
    <!-- Splash is outside #root so React doesn't destroy it -->
    <div id="splash">
      <div class="dot-grid"></div>
      <div class="glow-orb glow-orb-1"></div>
      <div class="glow-orb glow-orb-2"></div>
      <div class="splash-content">
        <div class="spinner-row">
          <div class="spinner"></div>
          <span style="font-weight:600;font-size:16px;letter-spacing:0.5px;">AlphaBase</span>
        </div>
        <div class="progress-track">
          <div class="progress-bar" id="splash-bar"></div>
        </div>
        <div class="step-label" id="splash-label">正在启动...</div>
        <div class="credit">Created by UICO</div>
      </div>
    </div>
    <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
