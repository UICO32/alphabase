<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlphaBase</title>
    <script>
      // Apply theme immediately to avoid flash of wrong theme
      (function() {
        var stored = localStorage.getItem('hepta-theme');
        var mode = stored === 'dark' || stored === 'light' ? stored : 'light';
        var resolved = mode;
        if (mode === 'system') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', resolved);
        var isDark = resolved === 'dark';
        document.documentElement.style.setProperty('--splash-bg', isDark ? '#18181b' : '#fafaf9');
        document.documentElement.style.setProperty('--splash-text', isDark ? '#e4e4e7' : '#18181b');
        document.documentElement.style.setProperty('--splash-muted', isDark ? '#71717a' : '#a8a29e');
        document.documentElement.style.setProperty('--splash-track', isDark ? '#3f3f46' : '#e7e5e4');
        document.documentElement.style.setProperty('--splash-credit', isDark ? '#3f3f46' : '#d4d4d8');
      })();
    </script>
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: var(--splash-bg); color: var(--splash-text);
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        transition: opacity 0.3s ease;
      }
      #splash.fade-out { opacity: 0; pointer-events: none; }

      /* --- Logo with shimmer sweep --- */
      #splash-title {
        font-weight: 700; font-size: 28px; letter-spacing: 3px;
        color: transparent; user-select: none;
        background: linear-gradient(
          110deg,
          var(--splash-text) 0%, var(--splash-text) 35%,
          #f97316 42%, #eab308 48%,
          #3b82f6 54%, #0ea5e9 60%,
          var(--splash-text) 66%, var(--splash-text) 100%
        );
        background-size: 250% 100%;
        background-clip: text;
        -webkit-background-clip: text;
        animation: logoShimmer 4.0s ease-in-out infinite;
        animation-delay: 0.35s;
      }
      @keyframes logoShimmer {
        0% { background-position: 250% 0; }
        100% { background-position: -250% 0; }
      }

      /* --- Credit --- */
      #splash-credit {
        margin-top: 8px; font-size: 10px; color: var(--splash-muted);
        letter-spacing: 0.5px; opacity: 0.7;
      }

      /* --- Progress bar --- */
      #splash-bar {
        width: 140px; height: 3px; background: var(--splash-track);
        border-radius: 2px; overflow: hidden; margin-top: 16px;
      }
      #splash-fill {
        height: 100%; width: 0%; background: var(--splash-text);
        border-radius: 2px; transition: width 0.3s ease;
      }

      /* --- Step text --- */
      #splash-step {
        font-size: 11px; color: var(--splash-muted);
        text-align: center; min-height: 16px; margin-top: 8px;
        animation: stepBreathe 2s ease-in-out infinite alternate;
      }
      @keyframes stepBreathe {
        0% { opacity: 0.5; }
        100% { opacity: 1; }
      }
    </style>
  </head>
  <body spellcheck="false">
    <div id="splash">
      <div id="splash-title">AlphaBase</div>
      <div id="splash-credit">Designed by UICO Lab</div>
      <div id="splash-bar"><div id="splash-fill"></div></div>
      <div id="splash-step"></div>
    </div>
    <div id="root"></div>
    <script>
      // Global function for main process to call via executeJavaScript
      var __splashSteps = ['初始化工作区', '加载卡片数据', '加载画板快照', '恢复回收站', '准备就绪'];
      window.__updateSplashProgress = function(stepIndex) {
        var fill = document.getElementById('splash-fill');
        var label = document.getElementById('splash-step');
        var pct = Math.round((stepIndex / (__splashSteps.length - 1)) * 100);
        fill.style.width = pct + '%';
        label.textContent = stepIndex >= 0 && stepIndex < __splashSteps.length ? __splashSteps[stepIndex] : '';
      };
      window.__dismissSplash = function() {
        var splash = document.getElementById('splash');
        splash.classList.add('fade-out');
        setTimeout(function() { splash.remove(); }, 300);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
