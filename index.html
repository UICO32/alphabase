<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlphaBase</title>
    <script>
      // Apply theme immediately to avoid flash of wrong theme
      (function() {
        var stored = localStorage.getItem('hepta-theme');
        var mode = stored === 'dark' || stored === 'light' ? stored : 'light';
        var resolved = mode;
        if (mode === 'system') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', resolved);
        var isDark = resolved === 'dark';
        document.documentElement.style.setProperty('--splash-bg', isDark ? '#18181b' : '#fafafa');
        document.documentElement.style.setProperty('--splash-text', isDark ? '#fafafa' : '#18181b');
        document.documentElement.style.setProperty('--splash-muted', isDark ? '#a1a1aa' : '#71717a');
        document.documentElement.style.setProperty('--splash-track', isDark ? '#3f3f46' : '#e4e4e7');
        document.documentElement.style.setProperty('--splash-credit', isDark ? '#3f3f46' : '#d4d4d8');
      })();
    </script>
    <style>
      #splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: var(--splash-bg); color: var(--splash-text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        transition: opacity 0.3s ease;
      }
      #splash.fade-out { opacity: 0; pointer-events: none; }
      #splash-title { font-weight: 700; font-size: 18px; letter-spacing: 2px; margin-bottom: 24px; }
      #splash-title span {
        display: inline-block; opacity: 0;
        transform: translateY(10px) scale(0.85);
        animation: charReveal 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards;
      }
      @keyframes charReveal { to { opacity: 1; transform: translateY(0) scale(1); } }
      #splash-bar {
        width: 160px; height: 3px; background: var(--splash-track);
        border-radius: 2px; overflow: hidden; margin-bottom: 12px;
      }
      #splash-fill {
        height: 100%; width: 0%; background: #3b82f6;
        border-radius: 2px; transition: width 0.3s ease;
      }
      #splash-step {
        font-size: 12px; color: var(--splash-muted);
        text-align: center; min-height: 16px;
      }
      #splash-credit {
        margin-top: 28px; font-size: 9px; color: var(--splash-credit);
        letter-spacing: 0.5px; opacity: 0; animation: fadeIn 0.3s 1.2s ease forwards;
      }
      @keyframes fadeIn { to { opacity: 0.6; } }
    </style>
  </head>
  <body spellcheck="false">
    <div id="splash">
      <div id="splash-title"></div>
      <div id="splash-bar"><div id="splash-fill"></div></div>
      <div id="splash-step"></div>
      <div id="splash-credit">Designed by UICO</div>
    </div>
    <div id="root"></div>
    <script>
      // Title animation
      (function() {
        var title = 'AlphaBase';
        var el = document.getElementById('splash-title');
        for (var i = 0; i < title.length; i++) {
          var span = document.createElement('span');
          span.textContent = title[i];
          span.style.animationDelay = (i * 0.05) + 's';
          el.appendChild(span);
        }
      })();
      // Global function for main process to call via executeJavaScript
      var __splashSteps = ['初始化工作区', '加载卡片数据', '加载画板快照', '恢复回收站', '准备就绪'];
      window.__updateSplashProgress = function(stepIndex) {
        var fill = document.getElementById('splash-fill');
        var label = document.getElementById('splash-step');
        var pct = Math.round((stepIndex / (__splashSteps.length - 1)) * 100);
        fill.style.width = pct + '%';
        label.textContent = stepIndex >= 0 && stepIndex < __splashSteps.length ? __splashSteps[stepIndex] : '';
      };
      window.__dismissSplash = function() {
        var splash = document.getElementById('splash');
        splash.classList.add('fade-out');
        setTimeout(function() { splash.remove(); }, 300);
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
